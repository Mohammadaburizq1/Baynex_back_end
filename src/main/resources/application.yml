spring:
  application:
    name: shoplink-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # Optional suffix e.g. Azure: DB_URL_SUFFIX=?sslmode=require
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shoplink_db}${DB_URL_SUFFIX:}
    username: ${DB_USERNAME:shoplink_user}
    password: ${DB_PASSWORD:shoplink_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    admin-refresh-expiration-days: ${JWT_ADMIN_REFRESH_EXPIRATION_DAYS:1}
    customer-refresh-expiration-days: ${JWT_CUSTOMER_REFRESH_EXPIRATION_DAYS:30}
  auth:
    require-email-verification-for-login: ${REQUIRE_EMAIL_VERIFICATION_FOR_LOGIN:false}
    expose-tokens-in-response: ${EXPOSE_AUTH_TOKENS_IN_RESPONSE:false}
    refresh-token-delivery: ${REFRESH_TOKEN_DELIVERY:BODY}
    mfa-challenge-expiration-minutes: ${MFA_CHALLENGE_EXPIRATION_MINUTES:5}
    require-super-admin-mfa: ${REQUIRE_SUPER_ADMIN_MFA:true}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    email-verification-expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:48}
    password-reset-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
  security:
    hsts:
      enabled: ${HSTS_ENABLED:false}
      max-age-seconds: ${HSTS_MAX_AGE_SECONDS:31536000}
      include-subdomains: ${HSTS_INCLUDE_SUBDOMAINS:true}
      preload: ${HSTS_PRELOAD:false}
    login:
      merchant-lock-threshold1: 5
      merchant-lock-threshold2: 10
      merchant-lock-threshold3: 20
      admin-lock-threshold1: 3
      admin-lock-threshold2: 5
      admin-lock-threshold3: 10
      lock-minutes1: 15
      lock-minutes2: 60
      risk-extra-verification: 50
      risk-security-alert: 80
      risk-block-login: 100
      mfa-dev-bypass: ${MFA_DEV_BYPASS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173,http://localhost:4200}
    # Optional: comma-separated patterns (see `application-local.yml`). Prefer env in production.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@shoplink.app}
    from-name: ${MAIL_FROM_NAME:khanGates}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
    password-reset-path: ${MAIL_PASSWORD_RESET_PATH:/reset-password}
    verify-email-path: ${MAIL_VERIFY_EMAIL_PATH:/verify-email}
    admin-password-reset-path: ${MAIL_ADMIN_PASSWORD_RESET_PATH:/admin/reset-password}

springdoc:
  api-docs:
    enabled: ${app.swagger.enabled:true}
  swagger-ui:
    enabled: ${app.swagger.enabled:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
